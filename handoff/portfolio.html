<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>alex.curiel — Senior QA Automation Engineer & Web Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
/* ============ THEME TOKENS ============ */
:root, [data-theme="dark"] {
  --bg-primary:    #08171E;
  --bg-surface:    #042B44;
  --bg-elevated:   #096B90;
  --text-primary:  #A1CCDC;
  --text-secondary:#71B7D5;
  --text-muted:    #096B90;
  --accent:        #9E291E;
  --accent-dark:   #7B241E;
  --accent-glow:   rgba(158,41,30,0.18);
  --border:        rgba(161,204,220,0.10);
  --tag-bg:        rgba(9,107,144,0.22);
  --card-shadow:   0 1px 0 rgba(255,255,255,0.02) inset;
}
[data-theme="light"] {
  --bg-primary:    #D8D7D2;
  --bg-surface:    #164346;   /* deep teal — major surface */
  --bg-elevated:   #1d5559;
  --text-primary:  #182B30;
  --text-secondary:#164346;
  --text-muted:    #2A5A5E;
  --accent:        #9E291E;
  --accent-dark:   #7B241E;
  --accent-glow:   rgba(158,41,30,0.22);
  --border:        rgba(24,43,48,0.18);
  --tag-bg:        rgba(158,41,30,0.10);
  --card-shadow:   0 1px 0 rgba(255,255,255,0.6) inset;
}
/* Light mode — Alone palette: stone base, teal surfaces, crimson accents */
[data-theme="light"] body { background: var(--bg-primary); }
[data-theme="light"] .navbar { background: color-mix(in srgb, #D8D7D2 92%, transparent); }
[data-theme="light"] .chip { color: #fff; background: #164346; }
[data-theme="light"] .proj-tag { color: #A1CCDC; background: rgba(22,67,70,0.18); }
[data-theme="light"] .tech-icon { color: #fff; background: var(--accent); }
[data-theme="light"] .proj-icon { color: #fff; background: var(--accent); }
[data-theme="light"] .audience-toggle { background: #fff; border-color: rgba(24,43,48,0.14); }
[data-theme="light"] .proj-tabs { background: #fff; border-color: rgba(24,43,48,0.14); }

/* About meta cards — keep light/cream */
[data-theme="light"] .about-meta div { background: #EEEDEA; border-color: rgba(24,43,48,0.10); }
[data-theme="light"] .about-meta .k { color: var(--accent); }
[data-theme="light"] .about-meta strong { color: #182B30; }

/* Project cards — stone surface, teal trim */
[data-theme="light"] .proj-card { background: #EEEDEA; border-color: rgba(24,43,48,0.10); }
[data-theme="light"] .proj-card:hover { border-color: var(--accent); }
[data-theme="light"] .proj-arrow { background: rgba(255,255,255,0.85); border-color: rgba(24,43,48,0.14); color: #164346; }
[data-theme="light"] .proj-cat { color: #164346; }

/* Technologies — TEAL section */
[data-theme="light"] .tech-section { background: #164346; border-color: rgba(24,43,48,0.18); color: #D8D7D2; }
[data-theme="light"] .tech-section h2,
[data-theme="light"] .tech-section .section-head p,
[data-theme="light"] .tech-section .tech-cat { color: #D8D7D2; }
[data-theme="light"] .tech-section .eyebrow { color: #fff; }
[data-theme="light"] .tech-section .eyebrow::before { background: #fff; }
[data-theme="light"] .tech-item { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.10); }
[data-theme="light"] .tech-item .tech-label { color: #D8D7D2; }
[data-theme="light"] .tech-item:hover { background: rgba(255,255,255,0.10); border-color: var(--accent); }
[data-theme="light"] .tech-item:hover .tech-label { color: #fff; }

/* Experience */
[data-theme="light"] .exp-row { border-color: rgba(24,43,48,0.14); }

/* Forms */
[data-theme="light"] .contact-form { background: #EEEDEA; border-color: rgba(24,43,48,0.10); }
[data-theme="light"] .field input,
[data-theme="light"] .field textarea { background: #fff; border-color: rgba(24,43,48,0.14); color: #182B30; }
[data-theme="light"] .contact-success { background: #EEEDEA; border-color: rgba(24,43,48,0.10); }

/* Chrome */
[data-theme="light"] .navbar,
[data-theme="light"] .footer,
[data-theme="light"] .hero-stats { border-color: rgba(24,43,48,0.14); }
[data-theme="light"] .theme-toggle { background: #EEEDEA; border-color: rgba(24,43,48,0.14); }
[data-theme="light"] .social-btn { background: #164346; border-color: #164346; color: #D8D7D2; }
[data-theme="light"] .social-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
[data-theme="light"] .modal-panel,
[data-theme="light"] .modal-head { border-color: rgba(24,43,48,0.14); }
[data-theme="light"] .modal-close { background: #EEEDEA; border-color: rgba(24,43,48,0.14); }
[data-theme="light"] .portrait { border-color: rgba(24,43,48,0.16); background: #EEEDEA; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'DM Sans', system-ui, sans-serif;
  font-weight: 400;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background 0.4s ease, color 0.3s ease;
  overflow-x: hidden;
}
body, body * {
  transition: background-color 0.4s ease, color 0.3s ease, border-color 0.3s ease;
}

/* Type */
.font-display { font-family: 'Syne', sans-serif; font-weight: 800; letter-spacing: -0.02em; }
.font-mono    { font-family: 'JetBrains Mono', ui-monospace, monospace; }
h1, h2, h3, h4 { font-family: 'Syne', sans-serif; font-weight: 800; letter-spacing: -0.02em; margin: 0; color: var(--text-primary); }
p { margin: 0; line-height: 1.75; color: var(--text-secondary); }

a { color: inherit; text-decoration: none; }

::selection { background: var(--accent); color: #fff; }

/* Layout */
.container { max-width: 1100px; margin: 0 auto; padding: 0 2.5rem; }
section { padding: 5.5rem 0; }
@media (max-width: 720px) {
  .container { padding: 0 1.25rem; }
  section { padding: 4rem 0; }
}

/* Eyebrow label */
.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 0.65rem;
}
.eyebrow::before {
  content: "";
  width: 28px;
  height: 1px;
  background: var(--accent);
}
.eyebrow.no-line::before { display: none; }

/* ============ NAVBAR ============ */
.navbar {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  background: color-mix(in srgb, var(--bg-primary) 92%, transparent);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.1rem 2.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
}
.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.05rem;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}
.logo .dot { color: var(--accent); }

.nav-links { display: flex; gap: 2rem; align-items: center; }
.nav-link {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-muted);
  position: relative;
  padding: 0.4rem 0;
  cursor: pointer;
}
.nav-link::after {
  content: "";
  position: absolute;
  left: 0; bottom: -2px;
  width: 0; height: 1px;
  background: var(--accent);
  transition: width 0.28s ease;
}
.nav-link:hover { color: var(--accent); }
.nav-link:hover::after { width: 100%; }

.nav-right { display: flex; align-items: center; gap: 1rem; }

.theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.45rem 0.55rem;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-secondary);
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  transition: border-color 0.2s ease, color 0.2s ease;
  min-height: 36px;
  min-width: 64px;
  justify-content: center;
}
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
.theme-toggle svg { width: 14px; height: 14px; }

.hamburger {
  display: none;
  background: transparent;
  border: 1px solid var(--border);
  width: 44px; height: 44px;
  border-radius: 8px;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-primary);
}
@media (max-width: 720px) {
  .nav-links { display: none; }
  .nav-links.open {
    display: flex;
    position: absolute; top: 100%; left: 0; right: 0;
    flex-direction: column;
    background: var(--bg-primary);
    border-bottom: 1px solid var(--border);
    padding: 1.5rem 2rem;
    align-items: flex-start;
    gap: 1rem;
  }
  .hamburger { display: inline-flex; }
}

/* ============ HERO ============ */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  position: relative;
  padding-top: 6rem;
  padding-bottom: 4rem;
  overflow: hidden;
}
.hero-orb {
  position: absolute;
  width: 720px; height: 720px;
  left: -200px; top: -100px;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
  filter: blur(40px);
  pointer-events: none;
  animation: orbPulse 8s ease-in-out infinite;
  z-index: 0;
}
.hero-orb.b {
  left: auto; right: -300px; top: auto; bottom: -200px;
  width: 580px; height: 580px;
  animation-delay: 4s;
}
@keyframes orbPulse {
  0%, 100% { opacity: 0.55; transform: scale(1); }
  50%      { opacity: 0.85; transform: scale(1.08); }
}

.hero-inner { position: relative; z-index: 1; width: 100%; }

.hero-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 3rem;
  align-items: center;
}
@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; gap: 2.5rem; }
}

.hero-eyebrow { margin-bottom: 1.5rem; }

.hero h1 {
  font-size: clamp(3rem, 7vw, 6rem);
  line-height: 1.0;
  margin-bottom: 1.5rem;
}
.hero-subtitle {
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  font-size: 1.15rem;
  color: var(--text-muted);
  max-width: 480px;
  margin-bottom: 1.4rem;
}
.hero-body {
  font-size: 0.98rem;
  color: var(--text-secondary);
  max-width: 540px;
  margin-bottom: 2rem;
  line-height: 1.75;
}

.audience-toggle {
  display: inline-flex;
  padding: 4px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  margin-bottom: 1.6rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.audience-toggle button {
  background: transparent;
  color: var(--text-muted);
  border: none;
  padding: 0.55rem 1.1rem;
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
  font-size: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  transition: all 0.25s ease;
  min-height: 36px;
}
.audience-toggle button.active {
  background: var(--accent);
  color: #fff;
}

.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; }
.chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.05em;
  padding: 0.4rem 0.8rem;
  border-radius: 999px;
  background: var(--tag-bg);
  color: var(--text-secondary);
  border: 1px solid transparent;
}
.chip.accent { border-color: var(--accent); color: var(--accent); }

.cta-row { display: flex; flex-wrap: wrap; gap: 0.85rem; }
.btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 0.95rem 1.5rem;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.25s ease;
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover {
  background: var(--accent-dark);
  transform: translateY(-2px);
  box-shadow: 0 12px 28px var(--accent-glow);
}
.btn-secondary {
  background: transparent;
  color: var(--text-primary);
  border-color: var(--border);
}
.btn-secondary:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-2px);
}

/* Hero portrait */
.portrait {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  aspect-ratio: 4/5;
}
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter 0.4s ease; }
.portrait .portrait-img {
  filter: contrast(1.04) saturate(0.85) brightness(0.96);
  mix-blend-mode: normal;
}
[data-theme="dark"] .portrait .portrait-img {
  filter: contrast(1.05) saturate(0.65) brightness(0.82) hue-rotate(-8deg);
}
[data-theme="dark"] .portrait::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(8,23,30,0.0) 40%, rgba(8,23,30,0.55) 100%), radial-gradient(circle at 30% 20%, rgba(9,107,144,0.18), transparent 60%);
  pointer-events: none;
  mix-blend-mode: multiply;
}
[data-theme="light"] .portrait::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 60%, rgba(22,67,70,0.18) 100%);
  pointer-events: none;
}
.portrait-meta {
  position: absolute; left: 1rem; bottom: 1rem; right: 1rem;
  display: flex; justify-content: space-between; align-items: end;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-primary);
  z-index: 2;
}
.portrait-meta .blink {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: #4ade80; margin-right: 0.4rem; vertical-align: middle;
  animation: blink 1.6s ease-in-out infinite;
}
@keyframes blink { 50% { opacity: 0.3; } }

/* Hero stats */
.hero-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
  margin-top: 3rem;
  padding-top: 2.5rem;
  border-top: 1px solid var(--border);
}
@media (max-width: 600px) { .hero-stats { grid-template-columns: 1fr; } }
.stat-num {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: clamp(2rem, 4vw, 2.8rem);
  line-height: 1;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}
.stat-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-muted);
  margin-top: 0.5rem;
}

/* ============ SECTION HEADER ============ */
.section-head {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2rem;
  align-items: end;
  margin-bottom: 3rem;
}
@media (max-width: 720px) { .section-head { grid-template-columns: 1fr; } }
.section-head h2 {
  font-size: clamp(2rem, 4.5vw, 3.2rem);
  line-height: 1.05;
  margin-top: 1rem;
}
.section-head p { color: var(--text-secondary); max-width: 420px; }

/* ============ ABOUT ============ */
.about-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 4rem;
  align-items: start;
}
@media (max-width: 900px) { .about-grid { grid-template-columns: 1fr; gap: 2.5rem; } }

.about-body p { font-weight: 300; font-size: 1.02rem; color: var(--text-secondary); margin-bottom: 1rem; }

.skill-list { display: flex; flex-direction: column; gap: 1.05rem; }
.skill {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.4rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.skill .label { color: var(--text-secondary); }
.skill .pct { color: var(--accent); }
.skill .bar { grid-column: 1 / -1; height: 4px; background: var(--tag-bg); border-radius: 2px; overflow: hidden; }
.skill .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 2px; transform-origin: left; }

.about-meta {
  margin-top: 2rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.about-meta div { padding: 0.85rem 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-surface); }
.about-meta strong { display: block; color: var(--text-primary); font-weight: 600; margin-top: 4px; letter-spacing: 0.05em; }
.about-meta .k { color: var(--text-muted); }

/* ============ PROJECTS ============ */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.4rem;
}
@media (max-width: 900px) { .projects-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 720px) { .projects-grid { grid-template-columns: 1fr; } }

.proj-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 0;
  cursor: pointer;
  transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  text-align: left;
  font: inherit;
  color: inherit;
  width: 100%;
}
.proj-card::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent);
  opacity: 0; transition: opacity 0.3s ease;
}
.proj-card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: 0 18px 40px var(--accent-glow); }
.proj-card:hover::before { opacity: 1; }

.proj-thumb {
  aspect-ratio: 16/10;
  width: 100%;
  background: var(--bg-elevated);
  position: relative;
  overflow: hidden;
}
.proj-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
.proj-card:hover .proj-thumb img { transform: scale(1.04); }

.proj-arrow {
  position: absolute; top: 0.8rem; right: 0.8rem;
  width: 36px; height: 36px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--bg-primary) 80%, transparent);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
  transition: all 0.3s ease;
}
.proj-card:hover .proj-arrow { color: var(--accent); border-color: var(--accent); transform: translate(2px, -2px); }

.proj-body { padding: 2rem; display: flex; flex-direction: column; gap: 0.9rem; flex: 1; }
.proj-icon-row { display: flex; align-items: center; gap: 0.65rem; }
.proj-icon {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--tag-bg);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
}
.proj-cat {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--text-muted);
}
.proj-title { font-size: 1.25rem; line-height: 1.15; }
.proj-desc { font-size: 0.92rem; color: var(--text-secondary); line-height: 1.6; }

.proj-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: auto; padding-top: 0.5rem; }
.proj-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.04em;
  padding: 0.3rem 0.6rem;
  border-radius: 999px;
  background: var(--tag-bg);
  color: var(--text-secondary);
}

.proj-tabs {

/* ============ Reveal-on-scroll ============ */
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    const el = ref.current;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { el.classList.add("in"); io.unobserve(el); }
        });
      },
      { threshold: 0.1, rootMargin: "0px 0px -60px 0px" }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

function Skill({ label, pct }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } }),
      { threshold: 0.4 }
    );
    io.observe(ref.current);
    return () => io.disconnect();
  }, []);
  return (
    <div className="skill" ref={ref}>
      <span className="label">{label}</span>
      <span className="pct">{pct}%</span>
      <div className="bar"><span style={{ transform: `scaleX(${shown ? pct / 100 : 0})`, transition: "transform 1s cubic-bezier(0.22, 1, 0.36, 1)" }}/></div>
    </div>
  );
}

              </div>
              <button type="submit" className="btn btn-primary contact-submit" disabled={status === "submitting"}>
                {status === "submitting" ? (<><span className="spinner"/> Sending...</>) : (<>Send Message <Icon.arrow style={{ width: 14, height: 14 }}/></>)}
              </button>
              {status === "error" ? (<div className="form-error">{errMsg}</div>) : null}
            </form>
          )}

          <div className="socials">
            <a className="social-btn" href="https://github.com" aria-label="GitHub"><Icon.github/></a>
            <a className="social-btn" href="https://linkedin.com" aria-label="LinkedIn"><Icon.linkedin/></a>
            <a className="social-btn" href="mailto:hello@alexcuriel.com" aria-label="Email"><Icon.email/></a>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ============ FOOTER ============ */
function Footer() {
  return (
    <footer className="footer">
      <div className="container footer-row">
        <div>© 2026 ALEJANDRO CURIEL</div>
        <div style={{ display: "flex", gap: "1.5rem", justifyContent: "center" }}>
          <a href="#about">ABOUT</a>
          <a href="#projects">WORK</a>
          <a href="#contact">CONTACT</a>
        </div>
        <div className="right">REACT · VITE · TAILWIND · VERCEL</div>
      </div>
    </footer>
  );
}

/* ============ MODAL ============ */
function ProjectModal({ project, close }) {
  useEffect(() => {
    if (!project) return;
    const onKey = (e) => { if (e.key === "Escape") close(); };
    document.body.style.overflow = "hidden";
    window.addEventListener("keydown", onKey);
    return () => {
      document.body.style.overflow = "";
      window.removeEventListener("keydown", onKey);
    };
  }, [project, close]);

  if (!project) return null;
  return (
    <div className="modal-backdrop" onClick={close}>
      <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <span className="eyebrow no-line" style={{ color: "var(--text-muted)" }}>
            {project.category === "qa" ? "QUALITY ASSURANCE" : "FRONTEND BUILD"}
          </span>
          <button className="modal-close" onClick={close} aria-label="Close"><Icon.close/></button>
        </div>

        <div className="modal-body">
          <div className="modal-image">
            {project.image ? (
              <img src={project.image} alt={project.title} onError={(e) => { e.currentTarget.style.display = 'none'; const ph = e.currentTarget.parentNode.querySelector('.img-placeholder'); if (ph) ph.style.display = 'flex'; }}/>
            ) : null}
            <div className="img-placeholder" style={{ display: project.image ? 'none' : 'flex' }}>{project.placeholder || project.title}</div>
          </div>

          <div className="modal-content">
            <h2 className="font-display">{project.title}</h2>

            <div className="modal-section">
              <h4>About</h4>
              <p>{project.about}</p>
            </div>

            {project.build ? (
              <div className="modal-section">
                <h4>Build</h4>
                <p>{project.build}</p>
              </div>
            ) : null}

            {project.testingFocus ? (
              <div className="modal-section">
                <h4>Testing Focus</h4>
                <div className="modal-tags">
                  {project.testingFocus.map((t) => <span key={t} className="proj-tag">{t}</span>)}
                </div>
              </div>
            ) : null}

            <div className="modal-section">
              <h4>Technologies Used</h4>
              <div className="modal-tags">
                {project.technologies.map((t) => <span key={t} className="proj-tag">{t}</span>)}
              </div>
            </div>

            {project.website ? (
              <div className="modal-section">
                <h4>Links</h4>
                <a href={project.website} target="_blank" rel="noreferrer" className="modal-cta">
                  Open Project <Icon.arrow style={{ width: 14, height: 14 }}/>
                </a>
              </div>
            ) : null}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============ APP ============ */
function App() {
  const [theme, setTheme] = useState(() => {
    if (typeof window === "undefined") return "dark";
    return localStorage.getItem("theme") || "dark";
  });
  const [audience, setAudience] = useState("qa");
  const [active, setActive] = useState(null);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("theme", theme);
  }, [theme]);

  return (
    <>
      <Navbar theme={theme} setTheme={setTheme}/>
      <main>
        <Hero audience={audience} setAudience={setAudience}/>
        <About/>
        <Projects open={setActive}/>
        <Technologies/>
        <Experience/>
        <Contact/>
      </main>
      <Footer/>
      <ProjectModal project={active} close={() => setActive(null)}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
